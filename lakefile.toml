name = "KFOL"
version = "0.1.0"
defaultTargets = ["KFOL", "Paper", "Report"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "complexitylib"
git = "https://github.com/cslib-community/complexitylib"
rev = "054834a4a4e6ac3ec50ed770bacea7fc42eccc7d"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "254e30e6d4299c51323aaeaf5f51a4763b375d4a"

[[require]]
name = "GameTheory"
git = "https://github.com/elazarg/GameTheory"
rev = "6f1af625b77215dd9e4454e6120275dbd8b61f51"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "KFOL"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Report"
