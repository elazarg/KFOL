name = "KFOL"
version = "0.1.0"
defaultTargets = ["KFOL", "Paper"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "complexitylib"
git = "https://github.com/SamuelSchlesinger/complexitylib"
rev = "257ad90ec5f547894cc20f27bd828839b1bf7bbf"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "94ea80f41a5678fce997a004f0d8d12dbe47cc4b"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "KFOL"

[[lean_lib]]
name = "Paper"
