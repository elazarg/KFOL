name = "KFOL"
version = "0.1.0"
defaultTargets = ["KFOL", "Paper", "Report"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "complexitylib"
git = "https://github.com/elazarg/complexitylib-community"
rev = "481355bbf30f161a600c5761053f42da888e7b0f"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "254e30e6d4299c51323aaeaf5f51a4763b375d4a"

[[require]]
name = "GameTheory"
git = "https://github.com/elazarg/GameTheory"
rev = "c20fa93ca3acdeb05fa75785788ce9a763544bcc"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "KFOL"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "Report"
